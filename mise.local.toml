redactions = ["FIREWORKS_API_KEY", "TAVILY_API_KEY"]

[env]
FIREWORKS_API_KEY = { value = "{{ exec(command='security find-generic-password -s fireworks-api-key -a $USER -w') }}", redact = true}
TAVILY_API_KEY = { value = "{{ exec(command='security find-generic-password -s tavily-api-key -a $USER -w') }}", redact = true}
